<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Oral Intake Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<style>
body { font-family: system-ui; background:#f5f7fa; padding:10px; }
h3 { text-align:center; }
input, button { padding:6px; margin:4px 0; width:100%; }
button { background:#2563eb; color:#fff; border:none; border-radius:4px; }
table { width:100%; border-collapse:collapse; background:#fff; margin-top:10px; }
th, td { border:1px solid #cbd5e1; padding:6px; font-size:13px; }
th { background:#e2e8f0; }
</style>
</head>

<body>

<h3>Oral Intake Log</h3>

<input id="date" type="date">
<input id="time" type="time">
<input id="food" placeholder="Food">
<input id="qty" placeholder="Quantity (10-12, 1/2)">
<input id="unit" placeholder="Unit (Bowl, ml)">
<button onclick="add()">Add Entry</button>

<div id="list"></div>

<script>
/* ---------- IndexedDB (SAFE STORAGE) ---------- */
let db;
const req = indexedDB.open("oralDB", 1);
req.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("log", { keyPath: "id" });
};
req.onsuccess = e => {
  db = e.target.result;
  render();
};

/* ---------- Helpers ---------- */
function parseQty(q) {
  if (!q) return 0;
  q = q.replace(/\s/g,"");
  if (/^\d+\/\d+$/.test(q)) {
    let [a,b]=q.split("/").map(Number);
    return a/b;
  }
  if (q.includes("-")) {
    let [a,b]=q.split("-").map(Number);
    return (a+b)/2;
  }
  return Number(q)||0;
}

/* ---------- Add ---------- */
function add() {
  if (!date.value || !time.value || !food.value || !qty.value) {
    alert("Fill all fields");
    return;
  }
  const tx = db.transaction("log","readwrite");
  tx.objectStore("log").put({
    id: Date.now(),
    date: date.value,
    time: time.value,
    food: food.value,
    qty: qty.value,
    unit: unit.value
  });
  tx.oncomplete = render;
}

/* ---------- Render ---------- */
function render() {
  const tx = db.transaction("log","readonly");
  const store = tx.objectStore("log");
  const req = store.getAll();
  req.onsuccess = () => {
    const data = req.result.sort((a,b)=>b.date.localeCompare(a.date));
    if (!data.length) {
      list.innerHTML="<p>No data</p>";
      return;
    }
    let html="<table><tr><th>Date</th><th>Food</th><th>Qty</th><th>Unit</th></tr>";
    data.forEach(e=>{
      html+=`<tr>
        <td>${e.date} ${e.time}</td>
        <td>${e.food}</td>
        <td>${parseQty(e.qty)}</td>
        <td>${e.unit}</td>
      </tr>`;
    });
    html+="</table>";
    list.innerHTML=html;
  };
}

/* ---------- Register Service Worker ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
