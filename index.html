<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Oral Intake Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">

<style>
body { font-family: system-ui; background:#f5f7fa; padding:10px; }
h3 { text-align:center; }
input, select, button {
  width:100%; padding:6px; margin:4px 0; font-size:14px;
}
button { background:#2563eb; color:white; border:none; border-radius:4px; }
table { width:100%; border-collapse:collapse; background:white; margin-top:10px; }
th, td { border:1px solid #cbd5e1; padding:6px; font-size:13px; }
th { background:#e2e8f0; }
.date-header { background:#dbeafe; font-weight:600; cursor:pointer; }
.total-row { background:#f0fdf4; font-weight:600; }
.hidden { display:none; }
td[contenteditable] { background:#fefce8; }
.delete { font-size:11px; padding:2px 6px; background:#9ca3af; }
.center { text-align:center; }
</style>
</head>

<body>

<h3>Oral Intake Log</h3>

<input id="search" placeholder="Search food / notes / date" oninput="render()">

<input type="date" id="date">
<input type="time" id="time">

<select id="foodSelect" onchange="food.value=this.value">
  <option value="">Select food</option>
  <option>Biscuit</option>
  <option>Water</option>
  <option>Sheera</option>
  <option>Upma</option>
  <option>Dal Khichdi</option>
  <option>Dal Bhat</option>
  <option>Nachni</option>
  <option>Khajur Juice</option>
  <option>Apple Juice</option>
  <option>Chiku Juice</option>
  <option>Anjeer Juice</option>
  <option>Mix Juice</option>
  <option>Protein Powder</option>
  <option>Idli</option>
  <option>Other</option>
</select>

<input id="food" placeholder="Food (auto-filled or type)">
<input id="qty" placeholder="Quantity (10-12, 1/2, 1+1/2)">
<select id="unit">
  <option>Bowl</option>
  <option>Spoons</option>
  <option>ml</option>
  <option>Piece</option>
</select>
<input id="notes" placeholder="Notes (water 20 ml)">
<button onclick="addEntry()">Add</button>

<div id="report"></div>

<script>
/* ================= DB ================= */
let db;
const req = indexedDB.open("oralDB",1);
req.onupgradeneeded=e=>{
  db=e.target.result;
  db.createObjectStore("log",{keyPath:"id"});
};
req.onsuccess=e=>{
  db=e.target.result;
  autoImport();
  render();
};

/* ================= Utils ================= */
function parseQty(q){
  if(!q) return 0;
  q=q.toLowerCase().replace(/\s/g,"");
  if(q.includes("-")){
    const[a,b]=q.split("-").map(Number);
    return(a+b)/2;
  }
  if(q.includes("+")){
    return q.split("+").reduce((s,v)=>s+(parseQty(v)||0),0);
  }
  if(q.includes("/")){
    const[a,b]=q.split("/").map(Number);
    return b?a/b:0;
  }
  return Number(q)||0;
}
function parseWater(n){
  const m=n?.match(/(\d+)\s*ml/i);
  return m?Number(m[1]):0;
}

/* ================= Add ================= */
function addEntry(){
  if(!date.value||!time.value||!food.value||!qty.value) return;
  const tx=db.transaction("log","readwrite");
  tx.objectStore("log").put({
    id:Date.now(),
    date:date.value,
    time:time.value,
    food:food.value,
    qty:qty.value,
    unit:unit.value.toLowerCase(),
    notes:notes.value
  });
  tx.oncomplete=render;
}

/* ================= Inline Save ================= */
function save(el){
  const id=Number(el.dataset.id);
  const f=el.dataset.field;
  const tx=db.transaction("log","readwrite");
  const s=tx.objectStore("log");
  s.get(id).onsuccess=e=>{
    const r=e.target.result;
    r[f]=el.innerText.trim();
    s.put(r);
  };
}

/* ================= Delete ================= */
function del(id){
  const tx=db.transaction("log","readwrite");
  tx.objectStore("log").delete(id);
  tx.oncomplete=render;
}

/* ================= Toggle ================= */
function toggle(id){
  document.getElementById(id).classList.toggle("hidden");
}

/* ================= Render ================= */
function render(){
  const q=search.value.toLowerCase();
  const tx=db.transaction("log","readonly");
  tx.objectStore("log").getAll().onsuccess=e=>{
    let data=e.target.result
      .filter(r=>`${r.date} ${r.food} ${r.notes}`.toLowerCase().includes(q))
      .sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));

    if(!data.length){report.innerHTML="<p>No data</p>";return;}

    let h="<table>",cur="",tot={},water=0,first=true;
    data.forEach(r=>{
      if(r.date!==cur){
        if(cur) h+=totalRow(tot,water)+"</tbody>";
        cur=r.date; tot={}; water=0;
        const id="d"+cur;
        h+=`
        <tr class="date-header" onclick="toggle('${id}')">
          <td colspan="6">📅 ${cur}</td>
        </tr>
        <tbody id="${id}" class="${first?'':'hidden'}">
        <tr><th>Time</th><th>Food</th><th>Qty</th><th>Unit</th><th>Notes</th><th>Del</th></tr>`;
        first=false;
      }
      tot[r.unit]=(tot[r.unit]||0)+parseQty(r.qty);
      water+=parseWater(r.notes||"");
      h+=`
      <tr>
        <td contenteditable data-id="${r.id}" data-field="time" oninput="save(this)">${r.time}</td>
        <td contenteditable data-id="${r.id}" data-field="food" oninput="save(this)">${r.food}</td>
        <td contenteditable data-id="${r.id}" data-field="qty" oninput="save(this)">${r.qty}</td>
        <td contenteditable data-id="${r.id}" data-field="unit" oninput="save(this)">${r.unit}</td>
        <td contenteditable data-id="${r.id}" data-field="notes" oninput="save(this)">${r.notes||""}</td>
        <td class="center"><button class="delete" onclick="del(${r.id})">✖</button></td>
      </tr>`;
    });
    h+=totalRow(tot,water)+"</tbody></table>";
    report.innerHTML=h;
  };
}

function totalRow(t,w){
  return `<tr class="total-row"><td colspan="6">
  Total: ${Object.entries(t).map(([u,v])=>`${v.toFixed(1)} ${u}`).join(" | ")}
  ${w?`| Water ${w} ml`:''}
  </td></tr>`;
}
